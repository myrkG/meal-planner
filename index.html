</style></head><body><header class="v4-top"><div class="v4-topin"><div class="v4-brand" id="v4brand">Mes recettes</div><nav class="v4-nav" aria-label="Sections"><button data-tab="rotation">Rotation</button><button data-tab="recipes">Recettes</button><button data-tab="shopping">Épicerie</button><button data-tab="notes">Notes</button></nav><div class="v4-langs"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div></div></header><main class="v4-wrap" id="v4main"></main><footer class="v4-footer" id="v4footer"></footer><script id="v4-en" type="application/json">{"version":"4.0","title":"My Recipes — Flexible Two-Week Rotation","intro":"No mandatory Sunday cooking. Pick any recipe any day; each cooking session makes 3–4 complete portions. Groceries recalculate from the recipes you select.","weeks":[["gingerbeef","chili","porkchop","fajitas","shakechoc"],["koreanbeef","oregano","salmon","tomatocurry","shakeberry"]],"recipes":{"gingerbeef":{"id":"gingerbeef","week":1,"title":"Ginger-soy beef, soba and broccoli","servings":3,"minutes":30,"equipment":"Large skillet, noodle pot, microwave","ingredients":[{"id":"groundbeef","qty":450,"detail":"RAW weight"},{"id":"soba","qty":166,"detail":"2 tied bundles ~83 g each, DRY"},{"id":"broccoli","qty":450,"detail":"frozen, not thawed"},{"id":"soy","qty":45,"detail":"3 tbsp"},{"id":"honey","qty":10,"detail":"2 tsp"},{"id":"sesame","qty":10,"detail":"2 tsp"},{"id":"ginger","qty":2,"detail":"finely grated"},{"id":"water","qty":75,"detail":"45 mL for sauce + 30 mL for broccoli"}],"steps":["Boil water in a pot. Take EXACTLY two tied soba bundles of ~83 g each (166 g DRY total), not the whole 250 g pack. Cook for the package time and drain.","Microwave 450 g still-frozen broccoli with 30 mL (2 tbsp) water in a covered but vented bowl for 5–7 min. Stir and DRAIN extra water.","Mix ALL sauce in a small bowl: 45 mL soy sauce + 10 mL honey + 10 mL sesame oil + 2 tsp freshly grated ginger + 45 mL water. Stir until honey dissolves.","Heat a large skillet medium-high. Crumble in 450 g RAW ground beef and cook about 7–9 min, stirring until fully cooked (71°C / 160°F). Discard only excessive rendered fat.","Lower to medium. POUR ALL sauce onto the cooked beef; stir 2 min to coat.","Add ALL drained soba and broccoli to skillet; toss 1–2 min. Do not reserve any sauce for later.","Divide evenly into 3 containers. Each meal is COMPLETE; just reheat when needed."],"storage":"Reheat covered to 74°C / 165°F. Noodles and sauce are already mixed in.","nutrition":{"calories":565,"protein_g":42,"carbs_g":50,"fat_g":19,"basis":"per_portion","estimated":true}},"chili":{"id":"chili","week":1,"title":"Smoky turkey chili — complete meal","servings":4,"minutes":40,"equipment":"Large pot; lid optional","ingredients":[{"id":"groundturkey","qty":600,"detail":"RAW weight; not 900 g from two packs"},{"id":"crushedtomato","qty":1,"detail":"FULL 796 mL can with liquid"},{"id":"blackbeans","qty":1,"detail":"540 mL can, rinsed and drained"},{"id":"pepper","qty":1,"detail":"finely diced"},{"id":"onion","qty":0.5,"detail":"finely diced"},{"id":"oliveoil","qty":5,"detail":"1 tsp"},{"id":"chilipowder","qty":2},{"id":"cumin","qty":1},{"id":"paprika","qty":1},{"id":"salt","qty":0.5}],"steps":["Weigh exactly 600 g RAW ground turkey. If you bought two 450 g packs, set aside and freeze the remaining 300 g RAW; do not use both whole packs.","Dice 1 bell pepper and HALF a medium onion. Fully rinse and drain one 540 mL can black beans.","Heat 5 mL (1 tsp) olive oil over medium-high in a large pot. Cook pepper and half-onion 4–5 min.","Add 600 g ground turkey. Break into crumbles and cook about 7–10 min until completely cooked (74°C / 165°F).","Add exactly 2 tsp chili powder, 1 tsp ground cumin, 1 tsp smoked paprika and ½ tsp salt. Stir 30 sec.","Pour in the ENTIRE 796 mL can crushed tomatoes including liquid, plus ALL rinsed, drained black beans.","Bring to a gentle bubble, reduce to medium-low and simmer UNCOVERED for 20 min. Stir every 4–5 min; simmer 5 min longer if runny.","Taste after cooking, then divide into 4 similar bowls or containers. This chili is a complete meal, no rice required and nothing to add at serving."],"storage":"Reheat covered to 74°C / 165°F. No extra preparation.","nutrition":{"calories":405,"protein_g":42,"carbs_g":34,"fat_g":11,"basis":"per_portion","estimated":true}},"porkchop":{"id":"porkchop","week":1,"title":"Garlic-lime pork chops, potatoes and green beans","servings":4,"minutes":50,"equipment":"Oven, 2 trays, parchment, small bowl","ingredients":[{"id":"pork","qty":600,"detail":"RAW boneless weight: about 150 g per serving"},{"id":"potatoes","qty":800,"detail":"RAW weight; 2-cm cubes"},{"id":"greenbeans","qty":400,"detail":"frozen"},{"id":"oliveoil","qty":30,"detail":"15 mL potatoes, 15 mL pork sauce"},{"id":"dijon","qty":30,"detail":"2 tbsp"},{"id":"honey","qty":10,"detail":"2 tsp"},{"id":"lime","qty":1,"detail":"squeeze all juice (~30 mL)"},{"id":"garlic","qty":3,"detail":"finely minced"},{"id":"paprika","qty":1},{"id":"salt","qty":0.5,"detail":"¼ tsp potatoes, ¼ tsp pork"},{"id":"peppercorn","qty":0.25}],"steps":["Preheat oven to 205°C / 400°F. Line TWO trays with parchment: one for potatoes/beans, one for pork.","Cut 800 g RAW potatoes into ~2-cm cubes. Toss on first tray with 15 mL olive oil, 1 tsp smoked paprika and ¼ tsp salt. Arrange in one layer and roast for 20 min.","Meanwhile mix ALL pork sauce in a bowl: 30 mL Dijon + 10 mL honey + juice of ONE lime (~30 mL) + 3 minced garlic cloves + 15 mL olive oil + ¼ tsp salt + ¼ tsp black pepper.","Place 600 g RAW boneless pork chops on second tray. Brush ALL sauce onto both sides; reserve none for later.","After potatoes roast 20 min, flip them and add 400 g FROZEN green beans to their tray. Put the pork tray in oven too. Continue ~18–25 min depending on pork thickness, stirring beans once.","Remove pork when thickest center reaches 71°C / 160°F. If potatoes need more colour, roast 5–10 min longer; beans should be thoroughly hot.","Rest pork 3 min. Split pork, potatoes and green beans into FOUR containers. Divide any fully cooked pork-pan juices over servings.","Everything, including sauce and sides, is already cooked. Reheat leftovers to 74°C / 165°F."],"storage":"Pork and sauce are stored together. Reheat covered to 74°C / 165°F without overcooking.","nutrition":{"calories":485,"protein_g":36,"carbs_g":43,"fat_g":16,"basis":"per_portion","estimated":true}},"fajitas":{"id":"fajitas","week":1,"title":"Chicken-thigh fajita rice-and-bean bowls","servings":4,"minutes":35,"equipment":"Large lidded skillet, rice cooker","ingredients":[{"id":"thighs","qty":600,"detail":"BONELESS SKINLESS, RAW weight"},{"id":"rice","qty":150,"detail":"weighed DRY, not cooked"},{"id":"pepper","qty":2,"detail":"sliced"},{"id":"onion","qty":1,"detail":"sliced"},{"id":"blackbeans","qty":1,"detail":"540 mL can, rinsed and drained"},{"id":"salsa","qty":120,"detail":"8 tbsp, cooked into chicken"},{"id":"lime","qty":1,"detail":"juice added TO SKILLET"},{"id":"oliveoil","qty":15,"detail":"1 tbsp"},{"id":"paprika","qty":2},{"id":"cumin","qty":1},{"id":"chilipowder","qty":0.5},{"id":"salt","qty":0.5}],"steps":["Weigh exactly 150 g DRY rice on a scale (NOT the rice-cooker cup). Add water per rice packaging and start rice cooker. Divide finished rice into 4 servings.","Cut 600 g RAW BONELESS SKINLESS chicken thighs into 2-cm cubes. Slice 2 peppers and 1 onion into ~1-cm strips. Rinse and drain the entire 540 mL black bean can.","Mix EXACTLY 2 tsp smoked paprika + 1 tsp cumin + ½ tsp chili powder + ½ tsp salt in a bowl.","Heat 15 mL olive oil medium-high in large skillet. Cook chicken while stirring ~8–12 min, until thickest pieces reach 74°C / 165°F. Transfer fully cooked chicken to a clean plate.","Cook peppers and onion in same skillet 6–8 min. Return cooked chicken; add ALL spice mix, 120 mL salsa and ALL lime juice. Stir and bubble for 2 min.","Add ALL drained beans and stir 2 min to heat and coat. No salsa or lime is reserved for serving.","Divide all COOKED rice between 4 containers, then divide ALL chicken/vegetables/beans/salsa mixture evenly on top. Each gets chicken, rice, vegetables and sauce.","Complete meal: just reheat covered to 74°C / 165°F; nothing else to add."],"storage":"Salsa, lime and spices are already in the meal. Reheat to 74°C / 165°F.","nutrition":{"calories":490,"protein_g":38,"carbs_g":54,"fat_g":15,"basis":"per_portion","estimated":true}},"shakechoc":{"id":"shakechoc","week":1,"title":"3 chocolate-banana shakes (Wednesday)","servings":3,"minutes":5,"equipment":"Blender; make the three shakes separately","ingredients":[{"id":"whey","qty":90,"detail":"30 g per shake"},{"id":"oats","qty":90,"detail":"30 g DRY per shake"},{"id":"banana","qty":3,"detail":"1 banana per shake"},{"id":"peanut","qty":45,"detail":"15 g per shake"},{"id":"cocoa","qty":15,"detail":"5 g per shake"},{"id":"water","qty":900,"detail":"300 mL per shake"}],"steps":["Amounts above make THREE shakes, not one. Each shake: 30 g whey + 30 g dry oats + 1 banana + 15 g peanut butter + 5 g cocoa + 300 mL water.","For ONE shake, pour 300 mL water into blender. Add peeled banana, whey, dry oats, peanut butter and cocoa in measured amounts.","Blend 30–45 sec until smooth. Drink; make the other two when wanted in the same proportions.","You can premeasure the dry powders/oats, but three premixed shakes may not keep the same texture for days."],"storage":"Blend when drinking. A shake-only day is optional; eat a regular meal if too hungry.","nutrition":{"calories":445,"protein_g":38,"carbs_g":46,"fat_g":12,"basis":"per_portion","estimated":true}},"koreanbeef":{"id":"koreanbeef","week":2,"title":"Soy-maple ground beef, rice and broccoli","servings":3,"minutes":30,"equipment":"Skillet, rice cooker, microwave","ingredients":[{"id":"groundbeef","qty":450,"detail":"RAW"},{"id":"rice","qty":135,"detail":"DRY"},{"id":"broccoli","qty":450,"detail":"frozen"},{"id":"soy","qty":45,"detail":"3 tbsp"},{"id":"maple","qty":30,"detail":"2 tbsp"},{"id":"sesame","qty":10,"detail":"2 tsp"},{"id":"ginger","qty":2,"detail":"grated"},{"id":"garlic","qty":2,"detail":"minced"},{"id":"ricevinegar","qty":15,"detail":"1 tbsp"},{"id":"water","qty":75,"detail":"45 mL sauce + 30 mL broccoli"}],"steps":["Weigh 135 g DRY rice and cook with the package-directed water. Divide COOKED rice among three meals.","Microwave 450 g frozen broccoli covered/vented with 30 mL water for 5–7 min, then DRAIN extra water.","Mix ALL sauce: 45 mL soy + 30 mL maple syrup + 10 mL sesame oil + 2 tsp grated ginger + 2 minced garlic cloves + 15 mL rice vinegar + 45 mL water.","Brown 450 g RAW ground beef in a skillet medium-high, breaking into crumbles ~7–9 min until 71°C / 160°F; remove only excessive fat.","Reduce heat to medium, add ALL sauce to beef, and stir 2–3 min to reduce slightly.","Add drained broccoli and toss 1–2 min. Reserve no sauce for serving.","Divide COOKED rice among 3 containers, then divide ALL beef/broccoli/sauce mix over rice. Just reheat when eating."],"storage":"Everything is packaged together, sauce included. Reheat to 74°C / 165°F.","nutrition":{"calories":550,"protein_g":40,"carbs_g":58,"fat_g":18,"basis":"per_portion","estimated":true}},"oregano":{"id":"oregano","week":2,"title":"Lemon-oregano chicken and veggie rice","servings":4,"minutes":30,"equipment":"Large lidded skillet, rice cooker","ingredients":[{"id":"thighs","qty":600,"detail":"BONELESS SKINLESS, RAW"},{"id":"rice","qty":160,"detail":"DRY"},{"id":"asianveg","qty":500,"detail":"frozen"},{"id":"lemon","qty":1,"detail":"use all juice (~30 mL)"},{"id":"garlic","qty":3,"detail":"minced"},{"id":"oregano","qty":2},{"id":"oliveoil","qty":15,"detail":"1 tbsp"},{"id":"paprika","qty":1},{"id":"salt","qty":0.5},{"id":"water","qty":30,"detail":"2 tbsp for sauce"}],"steps":["Weigh 160 g DRY rice. Cook in rice cooker with water per packaging.","Cut 600 g RAW boneless skinless thighs into 2-cm chunks. Mince 3 garlic cloves. Leave 500 g Asian veg frozen.","Mix sauce: juice of 1 whole lemon (~30 mL), 2 tsp dried oregano, 1 tsp smoked paprika, ½ tsp salt, and 30 mL water. All goes into the cooking pan.","Heat 15 mL oil in large skillet over medium-high. Cook chicken while stirring 8–12 min until thickest chunks reach 74°C / 165°F.","Add 500 g frozen Asian vegetables. Cook 6–8 min, stirring, until hot and tender.","Add all 3 minced garlic cloves; stir 30 sec. Pour in ALL lemon-oregano mixture; reduce to medium and cook 2 min.","Divide COOKED rice among 4 containers and top evenly with all chicken, vegetables and pan juices. No finishing garnish is required."],"storage":"Sauce and vegetables are mixed in; reheat to 74°C / 165°F.","nutrition":{"calories":415,"protein_g":35,"carbs_g":45,"fat_g":12,"basis":"per_portion","estimated":true}},"salmon":{"id":"salmon","week":2,"title":"Maple-Dijon salmon with potatoes and green beans","servings":3,"minutes":40,"equipment":"Oven, Ninja air fryer, microwave","ingredients":[{"id":"salmon","qty":450,"detail":"RAW, three ~150 g pieces"},{"id":"potatoes","qty":600,"detail":"RAW, 2-cm cubes"},{"id":"greenbeans","qty":450,"detail":"frozen"},{"id":"dijon","qty":22.5,"detail":"1½ tbsp"},{"id":"maple","qty":10,"detail":"2 tsp"},{"id":"oliveoil","qty":15,"detail":"10 mL potatoes + 5 mL sauce"},{"id":"salt","qty":0.5,"detail":"¼ tsp potatoes + ¼ tsp salmon"},{"id":"peppercorn","qty":0.25},{"id":"water","qty":30,"detail":"for frozen green beans"}],"steps":["Preheat OVEN to 200°C / 400°F and line a salmon baking tray with parchment.","Cut 600 g RAW potatoes into ~2-cm cubes. Toss with 10 mL olive oil and ¼ tsp salt. AIR FRY in Ninja at 200°C / 400°F for 20–25 min, shaking halfway.","Mix ALL glaze: 22.5 mL Dijon (1½ tbsp) + 10 mL maple (2 tsp) + 5 mL olive oil + ¼ tsp salt + ¼ tsp pepper.","Arrange 450 g RAW salmon (about three 150 g portions) on lined tray. Brush ALL sauce onto pieces; none left for later.","Bake salmon about 12–18 min, thickness-dependent, until thickest center reaches 70°C / 158°F. Remove promptly to avoid drying.","Microwave 450 g frozen green beans with 30 mL water in a vented covered bowl for ~5–7 min, then drain.","Divide cooked salmon, potatoes, beans and any fully cooked salmon-pan juices evenly among 3 containers. Sauce is already included.","Reheat covered to 74°C / 165°F. Salmon is best eaten relatively soon; organize fridge/freezer however suits you."],"storage":"Salmon is best reheated just once; only heat the portion being eaten.","nutrition":{"calories":565,"protein_g":34,"carbs_g":44,"fat_g":24,"basis":"per_portion","estimated":true}},"tomatocurry":{"id":"tomatocurry","week":2,"title":"Tomato-coconut chicken curry with rice","servings":4,"minutes":35,"equipment":"Large skillet/pot, rice cooker","ingredients":[{"id":"thighs","qty":600,"detail":"BONELESS SKINLESS, RAW weight"},{"id":"rice","qty":160,"detail":"DRY"},{"id":"dicedtomato","qty":1,"detail":"FULL 398 mL can"},{"id":"coconut","qty":1,"detail":"FULL 400 mL can"},{"id":"asianveg","qty":500,"detail":"frozen"},{"id":"curry","qty":30,"detail":"2 tbsp"},{"id":"garlic","qty":2,"detail":"minced"},{"id":"oliveoil","qty":5,"detail":"1 tsp"}],"steps":["Weigh 160 g DRY rice and start rice cooker using water from package directions. Finished rice makes 4 portions.","Cut 600 g RAW boneless skinless chicken thighs into 2-cm chunks, mince 2 garlic cloves; keep 500 g Asian vegetables frozen.","Heat 5 mL (1 tsp) olive oil medium-high in a deep skillet/pot. Cook chicken 8–12 min, stirring, until thickest chunks are 74°C / 165°F.","Add 2 minced garlic cloves and 30 mL (2 tbsp) red curry paste; stir 30–60 sec.","Pour in the ENTIRE 398 mL diced tomato can WITH juice, then the ENTIRE 400 mL light coconut milk can. Stir smooth.","Add 500 g frozen Asian vegetables. Bring to gentle bubble; simmer uncovered medium-low 12–15 min, stirring occasionally.","Divide all COOKED rice among 4 containers, then divide the ENTIRE chicken/vegetable/curry sauce batch evenly over the rice. Nothing to add when serving."],"storage":"Rice and coconut-tomato sauce are fully assembled. Reheat to 74°C / 165°F.","nutrition":{"calories":515,"protein_g":36,"carbs_g":52,"fat_g":17,"basis":"per_portion","estimated":true}},"shakeberry":{"id":"shakeberry","week":2,"title":"3 vanilla-berry shakes (Wednesday)","servings":3,"minutes":5,"equipment":"Blender; prepare each shake separately","ingredients":[{"id":"whey","qty":90,"detail":"vanilla or plain: 30 g per shake"},{"id":"oats","qty":120,"detail":"40 g DRY per shake"},{"id":"berries","qty":450,"detail":"frozen: 150 g per shake"},{"id":"peanut","qty":45,"detail":"15 g per shake"},{"id":"water","qty":900,"detail":"300 mL per shake"}],"steps":["Ingredients shown are for THREE shakes. For ONE: 30 g whey + 40 g dry oats + 150 g frozen mixed berries + 15 g peanut butter + 300 mL water.","Pour 300 mL water into blender; add oats, whey, frozen berries, and peanut butter.","Blend 45–60 sec until smooth. Only add a splash of water if needed for texture.","Repeat twice when ready for the other shakes; premeasure dry ingredients if useful."],"storage":"Blend when drinking. Shake-only day is optional if you want solid food.","nutrition":{"calories":445,"protein_g":37,"carbs_g":49,"fat_g":12,"basis":"per_portion","estimated":true}}},"products":{"groundbeef":{"name":"Lean ground beef","category":"Meat","unit":"g","url":"https://voila.ca/products/ground-beef-lean-454-g/660101EA","pack":454},"groundturkey":{"name":"Lean ground turkey","category":"Meat","unit":"g","url":"https://voila.ca/products/compliments-ground-turkey-extra-lean-450-g/850787EA","hint":"If sold in 450 g packs, buy 2; freeze the remaining 300 g raw.","pack":450},"pork":{"name":"Boneless pork chops","category":"Meat","unit":"g","url":"https://voila.ca/categories/meat-seafood/pork/pork-ribs-chops-tenderloin/WEB3100883"},"thighs":{"name":"Boneless skinless chicken thighs","category":"Meat","unit":"g"},"salmon":{"name":"Raw salmon fillet","category":"Meat","unit":"g","url":"https://voila.ca/products/atlantic-salmon-fillet/1439110KG"},"whey":{"name":"Whey protein powder","category":"Meat","unit":"g"},"broccoli":{"name":"Frozen broccoli","category":"Produce & frozen","unit":"g","url":"https://voila.ca/products/compliments-frozen-broccoli-florets-500-g/326594EA","pack":500},"greenbeans":{"name":"Frozen green beans","category":"Produce & frozen","unit":"g","url":"https://voila.ca/products/best-buy-frozen-green-beans-cut-750-g/408990EA","pack":750},"asianveg":{"name":"Frozen Asian vegetable mix","category":"Produce & frozen","unit":"g","url":"https://voila.ca/products/compliments-frozen-stir-fry-asian-style-blend-500-g/250345EA","pack":500},"pepper":{"name":"Bell pepper","category":"Produce & frozen","unit":"each"},"onion":{"name":"Medium onion","category":"Produce & frozen","unit":"each","url":"https://voila.ca/products/compliments-onions-yellow-1-36-kg/615526EA"},"potatoes":{"name":"Regular potatoes (raw weight)","category":"Produce & frozen","unit":"g","url":"https://voila.ca/products/canada-potatoes-bag-2-27-kg/9051EA","pack":2270},"banana":{"name":"Medium banana","category":"Produce & frozen","unit":"each","url":"https://voila.ca/products/banana-1-count-ripe-in-3-4-days/958902EA"},"berries":{"name":"Frozen mixed berries","category":"Produce & frozen","unit":"g"},"lime":{"name":"Lime","category":"Produce & frozen","unit":"each","url":"https://voila.ca/products/lime-1-count/7687EA"},"lemon":{"name":"Lemon","category":"Produce & frozen","unit":"each"},"garlic":{"name":"Garlic clove","category":"Produce & frozen","unit":"clove"},"ginger":{"name":"Fresh grated ginger","category":"Produce & frozen","unit":"tsp","url":"https://voila.ca/products/ginger-root/8440KG"},"rice":{"name":"Dry rice (before cooking)","category":"Grains & cans","unit":"g"},"soba":{"name":"Blue Dragon dry soba noodles","category":"Grains & cans","unit":"g","url":"https://voila.ca/products/blue-dragon-noodles-soba-250-g/926384EA","hint":"Two tied bundles of ~83 g each; NOT the whole 250 g pack.","pack":250},"blackbeans":{"name":"Canned black beans (540 mL can)","category":"Grains & cans","unit":"can","url":"https://voila.ca/products/compliments-no-salt-added-canned-black-beans-540-ml/331490EA","pack":1},"crushedtomato":{"name":"Crushed tomatoes (796 mL can)","category":"Grains & cans","unit":"can","url":"https://voila.ca/products/unico-crushed-tomatoes-796-ml/915600EA","pack":1},"dicedtomato":{"name":"Diced tomatoes (398 mL can)","category":"Grains & cans","unit":"can","pack":1},"coconut":{"name":"Light coconut milk (400 mL can)","category":"Grains & cans","unit":"can","url":"https://voila.ca/products/kosa-light-coconut-milk-400-ml/569756EA","pack":1},"oats":{"name":"Dry rolled oats","category":"Grains & cans","unit":"g","url":"https://voila.ca/products/dan-d-pak-rolled-oats-1-kg/313459EA","pack":1000},"oliveoil":{"name":"Olive oil","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/liv99-extra-virgin-olive-oil-750-ml/785263EA","pack":750},"soy":{"name":"Reduced-sodium soy sauce","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/kikkoman-soy-sauce-less-sodium-296-ml/502424EA","pack":296},"honey":{"name":"Honey","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/compliments-pure-natural-liquid-honey-500-g/289980EA"},"sesame":{"name":"Sesame oil","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/emile-noel-organic-toasted-sesame-oil-virgin-250-ml/664012EA","pack":250},"maple":{"name":"Maple syrup","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/sensations-pure-maple-syrup-375-ml/249806EA","pack":375},"salsa":{"name":"Salsa","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/compliments-naturally-simple-salsa-medium-488-ml/697118EA","pack":488},"dijon":{"name":"Dijon mustard","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/compliments-prepared-dijon-mustard-original-325-ml/409731EA","pack":325},"curry":{"name":"Red curry paste","category":"Sauces & spices","unit":"ml","url":"https://voila.ca/products/thai-kitchen-curry-paste-red-112-g/519593EA"},"peanut":{"name":"Natural peanut butter","category":"Sauces & spices","unit":"g","url":"https://voila.ca/products/adams-creamy-natural-unsalted-peanut-butter-500-g/508502EA","pack":500},"cocoa":{"name":"Unsweetened cocoa powder","category":"Sauces & spices","unit":"g"},"chilipowder":{"name":"Chili powder (spice blend, not cayenne)","category":"Sauces & spices","unit":"tsp","url":"https://voila.ca/products/mccormick-gourmet-chili-powder-40-g/681670EA"},"cumin":{"name":"Ground cumin","category":"Sauces & spices","unit":"tsp","url":"https://voila.ca/products/club-house-ground-cumin-90-g/503752EA"},"paprika":{"name":"Smoked paprika","category":"Sauces & spices","unit":"tsp","url":"https://voila.ca/products/mccormick-smoked-paprika-46-g/164655EA"},"oregano":{"name":"Dried oregano","category":"Sauces & spices","unit":"tsp"},"ricevinegar":{"name":"Rice vinegar","category":"Sauces & spices","unit":"ml"},"salt":{"name":"Salt","category":"Sauces & spices","unit":"tsp"},"peppercorn":{"name":"Ground black pepper","category":"Sauces & spices","unit":"tsp"},"water":{"name":"Water","category":"Other","unit":"ml","skipShop":true}},"categories":["Meat","Produce & frozen","Grains & cans","Sauces & spices"],"assumptions":["Meat weights are RAW; rice, soba and oats weights are DRY. Ingredient quantities are for the ENTIRE batch, not one serving.","All savoury meals already include their sauce and sides BEFORE storage. Only reheat when eating.","Wednesday may remain three-shake day. Weekend restaurant breakfasts are a habit, not scheduled mandatory meals.","Refrigerate/freeze perishable meals within 2 hours in shallow containers. Refrigerator ≤ 4°C; use refrigerated leftovers ideally within 2–3 days or freeze.","Reheat leftovers to 74°C / 165°F. Initial cooking: poultry 74°C, ground beef 71°C, pork 71°C, fish 70°C. Source: Health Canada."],"safety_url":"https://www.canada.ca/fr/sante-canada/services/conseils-generaux-salubrite/temperatures-securitaires-cuisson-interne.html","storage_url":"https://www.canada.ca/fr/sante-canada/services/conseils-generaux-salubrite/conseils-salubrite-restes-alimentaires.html"}</script><script id="v4-fr" type="application/json">{"version":"4.0","title":"Mes recettes — rotation souple sur 2 semaines","intro":"Aucune cuisson obligatoire le dimanche. Choisis une recette quand tu veux; chaque cuisson donne 3 à 4 portions complètes. La liste d’épicerie se recalcule selon les recettes cochées.","weeks":[["gingerbeef","chili","porkchop","fajitas","shakechoc"],["koreanbeef","oregano","salmon","tomatocurry","shakeberry"]],"recipes":{"gingerbeef":{"id":"gingerbeef","week":1,"title":"Bœuf gingembre-soya, soba et brocoli","servings":3,"minutes":30,"equipment":"Grande poêle, casserole pour les nouilles, micro-ondes","ingredients":[{"id":"groundbeef","qty":450,"detail":"poids CRU"},{"id":"soba","qty":166,"detail":"2 bottes attachées de ~83 g, poids SEC"},{"id":"broccoli","qty":450,"detail":"surgelé, non décongelé"},{"id":"soy","qty":45,"detail":"3 c. à soupe"},{"id":"honey","qty":10,"detail":"2 c. à thé"},{"id":"sesame","qty":10,"detail":"2 c. à thé"},{"id":"ginger","qty":2,"detail":"râpé finement"},{"id":"water","qty":75,"detail":"45 ml pour la sauce + 30 ml pour le brocoli"}],"steps":["Mettre une casserole d’eau à bouillir. Prendre EXACTEMENT deux bottes de soba d’environ 83 g chacune (166 g SECS au total), pas tout le paquet de 250 g. Cuire selon la durée indiquée sur l’emballage; égoutter.","Mettre les 450 g de brocoli encore surgelé dans un bol allant au micro-ondes avec 30 ml d’eau (2 c. à soupe). Couvrir sans sceller; cuire 5 à 7 minutes, remuer, puis ÉGOUTTER le surplus d’eau.","Dans un bol, préparer TOUTE la sauce : 45 ml de soya + 10 ml de miel + 10 ml d’huile de sésame + 2 c. à thé de gingembre frais râpé + 45 ml d’eau. Mélanger jusqu’à ce que le miel soit dissous.","Chauffer une grande poêle à feu moyen-vif. Ajouter les 450 g de bœuf haché CRU, émietter et cuire environ 7 à 9 minutes en remuant, jusqu’à cuisson complète (71 °C). Retirer seulement un gros excédent de gras, s’il y en a.","Baisser à feu moyen. VERSER TOUTE la sauce préparée sur le bœuf cuit et remuer 2 minutes pour l’enrober.","Ajouter TOUTES les soba égouttées et le brocoli égoutté à la poêle. Mélanger 1 à 2 minutes; ne garder aucune sauce de côté pour plus tard.","Diviser en 3 contenants de taille semblable. Les repas sont COMPLETS : au moment de manger, seulement réchauffer."],"storage":"Réchauffer couvert jusqu’à 74 °C. Les nouilles et la sauce sont déjà dans chaque portion.","nutrition":{"calories":565,"protein_g":42,"carbs_g":50,"fat_g":19,"basis":"per_portion","estimated":true}},"chili":{"id":"chili","week":1,"title":"Chili fumé de dinde — repas complet","servings":4,"minutes":40,"equipment":"Grande casserole avec couvercle facultatif","ingredients":[{"id":"groundturkey","qty":600,"detail":"poids CRU, pas 900 g de deux paquets"},{"id":"crushedtomato","qty":1,"detail":"boîte COMPLÈTE de 796 ml, jus inclus"},{"id":"blackbeans","qty":1,"detail":"boîte de 540 ml, rincée et égouttée"},{"id":"pepper","qty":1,"detail":"en petits dés"},{"id":"onion","qty":0.5,"detail":"en petits dés"},{"id":"oliveoil","qty":5,"detail":"1 c. à thé"},{"id":"chilipowder","qty":2},{"id":"cumin","qty":1},{"id":"paprika","qty":1},{"id":"salt","qty":0.5}],"steps":["Sortir et PESER 600 g de dinde hachée CRUE. Si tu as acheté deux paquets de 450 g, réserver/congeler les 300 g restants crus; ne pas mettre les deux paquets.","Couper 1 poivron en petits dés et la MOITIÉ d’un oignon moyen en petits dés. Rincer et égoutter COMPLÈTEMENT une boîte de 540 ml de haricots noirs.","Chauffer 5 ml d’huile d’olive (1 c. à thé) à feu moyen-vif dans une grande casserole. Faire revenir le poivron et le demi-oignon 4 à 5 minutes.","Ajouter les 600 g de dinde hachée. Émietter à la spatule, cuire environ 7 à 10 minutes en remuant, jusqu’à cuisson complète (74 °C).","Ajouter EXACTEMENT 2 c. à thé de poudre de chili, 1 c. à thé de cumin, 1 c. à thé de paprika fumé et ½ c. à thé de sel. Remuer 30 secondes.","Verser la boîte COMPLÈTE de tomates broyées de 796 ml, avec son jus. Ajouter TOUS les haricots noirs rincés et égouttés. Bien remuer.","Ramener à un léger bouillonnement puis réduire à feu moyen-doux. Mijoter SANS couvercle 20 minutes, en remuant toutes les 4 à 5 minutes. Si c’est trop liquide, mijoter 5 minutes de plus.","Goûter une fois la cuisson terminée; répartir en 4 bols ou contenants de même taille. Le chili est un repas complet sans riz obligatoire; ne rien ajouter au dernier moment."],"storage":"Réchauffer couvert jusqu’à 74 °C; rien à préparer en plus.","nutrition":{"calories":405,"protein_g":42,"carbs_g":34,"fat_g":11,"basis":"per_portion","estimated":true}},"porkchop":{"id":"porkchop","week":1,"title":"Côtelettes ail-lime, patates et haricots verts","servings":4,"minutes":50,"equipment":"Four, 2 plaques, papier parchemin, petit bol","ingredients":[{"id":"pork","qty":600,"detail":"poids CRU sans os : 4 portions d’environ 150 g"},{"id":"potatoes","qty":800,"detail":"poids CRU; cubes de 2 cm"},{"id":"greenbeans","qty":400,"detail":"surgelés"},{"id":"oliveoil","qty":30,"detail":"15 ml pour patates, 15 ml dans sauce porc"},{"id":"dijon","qty":30,"detail":"2 c. à soupe"},{"id":"honey","qty":10,"detail":"2 c. à thé"},{"id":"lime","qty":1,"detail":"presser tout le jus (~30 ml)"},{"id":"garlic","qty":3,"detail":"hachées fin"},{"id":"paprika","qty":1},{"id":"salt","qty":0.5,"detail":"¼ c. à thé patates, ¼ c. à thé porc"},{"id":"peppercorn","qty":0.25}],"steps":["Préchauffer le four à 205 °C (400 °F). Préparer DEUX plaques recouvertes de papier parchemin, une pour les patates/haricots et l’autre pour le porc.","Couper les 800 g de patates CRUES en cubes d’environ 2 cm. Mélanger sur la première plaque avec 15 ml d’huile d’olive, 1 c. à thé de paprika fumé et ¼ c. à thé de sel. Étaler en une couche; mettre au four pour 20 minutes.","Pendant ce temps, faire la sauce dans un bol : 30 ml de Dijon + 10 ml de miel + le jus d’UNE lime (~30 ml) + 3 gousses d’ail hachées + 15 ml d’huile d’olive + ¼ c. à thé de sel + ¼ c. à thé de poivre. Mélanger.","Déposer les 600 g de côtelettes désossées CRUES sur la deuxième plaque. Badigeonner TOUTE la sauce sur les deux côtés des côtelettes. Ne rien réserver pour le service.","Quand les patates ont cuit 20 minutes, les retourner et ajouter les 400 g de haricots verts SURGELÉS sur leur plaque. Enfourner en même temps la plaque de porc. Continuer environ 18 à 25 minutes, selon l’épaisseur des côtelettes. Mélanger les haricots une fois.","Sortir les côtelettes dès qu’elles atteignent 71 °C au centre du morceau le plus épais. Si les patates ne sont pas tendres et dorées, les laisser 5 à 10 minutes de plus; les haricots doivent être bien chauds.","Laisser reposer le porc 3 minutes. Diviser en 4 contenants : ¼ du porc, ¼ des patates et ¼ des haricots par portion. Répartir le jus de cuisson du porc ENTRE les contenants, après cuisson complète.","Le repas est COMPLET avec sauce et accompagnements. Pour servir plus tard, seulement réchauffer jusqu’à 74 °C."],"storage":"Le porc et la sauce sont déjà ensemble. Réchauffer couvert à 74 °C; éviter de prolonger inutilement pour ne pas assécher.","nutrition":{"calories":485,"protein_g":36,"carbs_g":43,"fat_g":16,"basis":"per_portion","estimated":true}},"fajitas":{"id":"fajitas","week":1,"title":"Bol fajitas de hauts de cuisse, riz et haricots","servings":4,"minutes":35,"equipment":"Grande poêle avec couvercle, cuiseur à riz","ingredients":[{"id":"thighs","qty":600,"detail":"DÉSOSSÉS, SANS PEAU, poids CRU"},{"id":"rice","qty":150,"detail":"pesé SEC, pas 150 g cuits"},{"id":"pepper","qty":2,"detail":"en lanières"},{"id":"onion","qty":1,"detail":"en lanières"},{"id":"blackbeans","qty":1,"detail":"boîte de 540 ml, rincée et égouttée"},{"id":"salsa","qty":120,"detail":"8 c. à soupe; cuite avec le poulet"},{"id":"lime","qty":1,"detail":"jus ajouté À LA POÊLE"},{"id":"oliveoil","qty":15,"detail":"1 c. à soupe"},{"id":"paprika","qty":2},{"id":"cumin","qty":1},{"id":"chilipowder","qty":0.5},{"id":"salt","qty":0.5}],"steps":["Peser 150 g de riz SEC avec une balance (PAS le petit gobelet du cuiseur). Le mettre dans le cuiseur à riz avec l’eau selon l’emballage et démarrer la cuisson. Il sera partagé entre 4 portions.","Couper les 600 g de hauts de cuisse DÉSOSSÉS ET SANS PEAU CRUS en cubes de 2 cm. Couper 2 poivrons et 1 oignon en lanières de 1 cm. Rincer et égoutter toute la boîte de 540 ml de haricots noirs.","Dans un bol, mélanger les épices : EXACTEMENT 2 c. à thé de paprika fumé + 1 c. à thé de cumin + ½ c. à thé de poudre de chili + ½ c. à thé de sel.","Chauffer 15 ml d’huile d’olive dans une grande poêle à feu moyen-vif. Ajouter les morceaux de poulet et cuire en remuant 8 à 12 minutes, jusqu’à 74 °C dans les morceaux les plus épais. Transférer temporairement le poulet cuit dans une assiette propre.","Dans la même poêle, cuire poivrons et oignon 6 à 8 minutes jusqu’à tendreté. Remettre le poulet cuit, ajouter TOUT le mélange d’épices, les 120 ml de salsa et TOUT le jus de la lime. Remuer et laisser bouillonner 2 minutes.","Ajouter TOUS les haricots noirs rincés/égouttés à la poêle et remuer 2 minutes pour réchauffer et enrober de sauce. Il ne doit rester aucune salsa ou lime à ajouter plus tard.","Répartir le riz CUIT en 4 contenants égaux, puis répartir également TOUT le mélange poulet-légumes-haricots-salsa dans les mêmes contenants. Vérifier que chacun a du poulet, du riz, des légumes ET de la sauce.","Repas complets : pour manger, réchauffer couvert jusqu’à 74 °C, sans ajouter de sauce ou de conserves."],"storage":"La salsa, la lime et les épices sont déjà dans le plat. Réchauffer jusqu’à 74 °C.","nutrition":{"calories":490,"protein_g":38,"carbs_g":54,"fat_g":15,"basis":"per_portion","estimated":true}},"shakechoc":{"id":"shakechoc","week":1,"title":"3 shakes chocolat-banane (mercredi)","servings":3,"minutes":5,"equipment":"Mélangeur; trois shakes préparés séparément","ingredients":[{"id":"whey","qty":90,"detail":"30 g par shake"},{"id":"oats","qty":90,"detail":"30 g SECS par shake"},{"id":"banana","qty":3,"detail":"1 banane par shake"},{"id":"peanut","qty":45,"detail":"15 g par shake"},{"id":"cocoa","qty":15,"detail":"5 g par shake"},{"id":"water","qty":900,"detail":"300 ml par shake"}],"steps":["Les quantités ci-dessus sont pour TROIS shakes, pas un seul. Chaque shake contient 30 g whey + 30 g avoine sèche + 1 banane + 15 g beurre d’arachides + 5 g cacao + 300 ml d’eau.","Pour UN shake, mettre 300 ml d’eau dans le mélangeur. Ajouter la banane pelée, la whey, l’avoine sèche, le beurre d’arachides et le cacao, dans les quantités indiquées.","Mélanger 30 à 45 secondes jusqu’à texture homogène. Boire; répéter la recette identique pour les deux autres shakes au moment voulu.","Les poudres/avoine peuvent être préportionnées à l’avance; ne pas supposer que trois shakes déjà mélangés resteront aussi bons pendant plusieurs jours."],"storage":"À mélanger au moment de boire. Une journée de shakes demeure facultative; manger un vrai repas si la faim est trop importante.","nutrition":{"calories":445,"protein_g":38,"carbs_g":46,"fat_g":12,"basis":"per_portion","estimated":true}},"koreanbeef":{"id":"koreanbeef","week":2,"title":"Bœuf haché sauce soya-érable, riz et brocoli","servings":3,"minutes":30,"equipment":"Poêle, cuiseur à riz, micro-ondes","ingredients":[{"id":"groundbeef","qty":450,"detail":"poids CRU"},{"id":"rice","qty":135,"detail":"poids SEC"},{"id":"broccoli","qty":450,"detail":"surgelé"},{"id":"soy","qty":45,"detail":"3 c. à soupe"},{"id":"maple","qty":30,"detail":"2 c. à soupe"},{"id":"sesame","qty":10,"detail":"2 c. à thé"},{"id":"ginger","qty":2,"detail":"râpé"},{"id":"garlic","qty":2,"detail":"hachées"},{"id":"ricevinegar","qty":15,"detail":"1 c. à soupe"},{"id":"water","qty":75,"detail":"45 ml sauce + 30 ml brocoli"}],"steps":["Peser 135 g de riz SEC et démarrer le cuiseur avec l’eau selon l’emballage. Ce riz CUIT sera divisé entre trois repas.","Cuire 450 g de brocoli encore surgelé avec 30 ml d’eau dans un bol couvert/ventilé au micro-ondes 5 à 7 minutes; ÉGOUTTER le surplus d’eau.","Dans un bol, mélanger TOUTE la sauce : 45 ml de soya + 30 ml de sirop d’érable + 10 ml d’huile de sésame + 2 c. à thé de gingembre râpé + 2 gousses d’ail hachées + 15 ml de vinaigre de riz + 45 ml d’eau.","Faire brunir 450 g de bœuf haché CRU à feu moyen-vif dans une poêle, en l’émiettant environ 7 à 9 min jusqu’à 71 °C; retirer seulement l’excédent important de gras.","Baisser à feu moyen, ajouter TOUTE la sauce au bœuf et remuer 2 à 3 minutes, jusqu’à légère réduction.","Ajouter le brocoli égoutté et mélanger encore 1 à 2 minutes. Ne réserver aucune sauce pour la fin.","Diviser le riz CUIT en 3 contenants; partager par-dessus TOUT le mélange bœuf-brocoli-sauce. Réchauffer uniquement au moment de manger."],"storage":"Tout est assemblé dans les contenants, sauce comprise. Réchauffer à 74 °C.","nutrition":{"calories":550,"protein_g":40,"carbs_g":58,"fat_g":18,"basis":"per_portion","estimated":true}},"oregano":{"id":"oregano","week":2,"title":"Poulet citron-origan et riz aux légumes","servings":4,"minutes":30,"equipment":"Grande poêle avec couvercle, cuiseur à riz","ingredients":[{"id":"thighs","qty":600,"detail":"DÉSOSSÉS et SANS PEAU, poids CRU"},{"id":"rice","qty":160,"detail":"poids SEC"},{"id":"asianveg","qty":500,"detail":"surgelés"},{"id":"lemon","qty":1,"detail":"presser tout le jus (~30 ml)"},{"id":"garlic","qty":3,"detail":"hachées"},{"id":"oregano","qty":2},{"id":"oliveoil","qty":15,"detail":"1 c. à soupe"},{"id":"paprika","qty":1},{"id":"salt","qty":0.5},{"id":"water","qty":30,"detail":"2 c. à soupe pour la sauce"}],"steps":["Peser 160 g de riz SEC. Le faire cuire dans le cuiseur avec la quantité d’eau recommandée sur l’emballage.","Couper les 600 g de hauts de cuisse de poulet CRUS désossés sans peau en cubes de 2 cm. Hacher 3 gousses d’ail. Garder les 500 g de légumes asiatiques SURGELÉS.","Préparer la sauce dans un bol : jus de 1 citron entier (~30 ml) + 2 c. à thé d’origan séché + 1 c. à thé de paprika fumé + ½ c. à thé de sel + 30 ml d’eau. Tout le liquide sera utilisé pendant la cuisson.","Chauffer 15 ml d’huile dans une grande poêle à feu moyen-vif. Ajouter le poulet et cuire 8 à 12 min en remuant, jusqu’à 74 °C dans les morceaux les plus épais.","Ajouter 500 g de légumes encore surgelés. Cuire 6 à 8 minutes en remuant, jusqu’à ce que les légumes soient bien chauds et attendris.","Ajouter les 3 gousses d’ail hachées et remuer 30 secondes. Verser TOUTE la sauce citron-origan dans la poêle, réduire à feu moyen et cuire 2 minutes en mélangeant.","Partager le riz CUIT entre 4 contenants et répartir par-dessus le mélange de poulet/légumes avec tout son jus. Aucun citron ou assaisonnement supplémentaire n’est requis au service."],"storage":"Sauce et légumes déjà mélangés; réchauffer à 74 °C.","nutrition":{"calories":415,"protein_g":35,"carbs_g":45,"fat_g":12,"basis":"per_portion","estimated":true}},"salmon":{"id":"salmon","week":2,"title":"Saumon érable-Dijon, patates et haricots","servings":3,"minutes":40,"equipment":"Four, Ninja air fryer, micro-ondes","ingredients":[{"id":"salmon","qty":450,"detail":"poids CRU, 3 morceaux d’environ 150 g"},{"id":"potatoes","qty":600,"detail":"poids CRU; cubes de 2 cm"},{"id":"greenbeans","qty":450,"detail":"surgelés"},{"id":"dijon","qty":22.5,"detail":"1½ c. à soupe"},{"id":"maple","qty":10,"detail":"2 c. à thé"},{"id":"oliveoil","qty":15,"detail":"10 ml patates + 5 ml sauce"},{"id":"salt","qty":0.5,"detail":"¼ c. à thé patates + ¼ c. à thé saumon"},{"id":"peppercorn","qty":0.25},{"id":"water","qty":30,"detail":"pour les haricots surgelés"}],"steps":["Préchauffer le FOUR à 200 °C (400 °F). Préparer une plaque avec papier parchemin pour les trois portions de saumon.","Couper les 600 g de patates CRUES en cubes d’environ 2 cm. Mélanger avec 10 ml d’huile d’olive et ¼ c. à thé de sel. Mettre dans le NINJA, fonction AIR FRY, 200 °C pendant 20 à 25 minutes; secouer à mi-cuisson.","Préparer la sauce dans un petit bol : 22,5 ml de Dijon (1½ c. à soupe) + 10 ml de sirop d’érable (2 c. à thé) + 5 ml d’huile d’olive + ¼ c. à thé de sel + ¼ c. à thé de poivre.","Déposer 450 g de saumon cru (environ trois morceaux de 150 g) sur la plaque. Badigeonner TOUTE la sauce sur les trois morceaux. Ne pas garder de sauce pour plus tard.","Cuire le saumon au four environ 12 à 18 minutes, selon son épaisseur, jusqu’à 70 °C au centre. Le sortir dès qu’il est prêt pour éviter de le dessécher.","Pendant ce temps, cuire 450 g de haricots verts SURGELÉS au micro-ondes avec 30 ml d’eau, couverts sans sceller, environ 5 à 7 min. Égoutter l’eau.","Répartir saumon, patates et haricots cuits dans 3 contenants égaux, avec le jus de cuisson du saumon s’il y en a. Toutes les sauces sont déjà ajoutées.","Pour réchauffer, couvrir et chauffer jusqu’à 74 °C. Le saumon est meilleur consommé tôt après cuisson; tu gères frigo/congélateur selon tes besoins."],"storage":"Le saumon supporte moins bien les réchauffages répétés : ne réchauffer que la portion voulue.","nutrition":{"calories":565,"protein_g":34,"carbs_g":44,"fat_g":24,"basis":"per_portion","estimated":true}},"tomatocurry":{"id":"tomatocurry","week":2,"title":"Cari de poulet coco-tomate et riz","servings":4,"minutes":35,"equipment":"Grande poêle ou casserole, cuiseur à riz","ingredients":[{"id":"thighs","qty":600,"detail":"DÉSOSSÉS, SANS PEAU, poids CRU"},{"id":"rice","qty":160,"detail":"poids SEC"},{"id":"dicedtomato","qty":1,"detail":"boîte COMPLÈTE de 398 ml"},{"id":"coconut","qty":1,"detail":"boîte COMPLÈTE de 400 ml"},{"id":"asianveg","qty":500,"detail":"surgelés"},{"id":"curry","qty":30,"detail":"2 c. à soupe"},{"id":"garlic","qty":2,"detail":"hachées"},{"id":"oliveoil","qty":5,"detail":"1 c. à thé"}],"steps":["Peser 160 g de riz SEC et démarrer le cuiseur avec l’eau prévue sur l’emballage. Le riz cuit donnera 4 portions.","Couper les 600 g de hauts de cuisse de poulet CRUS désossés sans peau en cubes de 2 cm. Hacher 2 gousses d’ail. Garder 500 g de légumes asiatiques SURGELÉS.","Chauffer 5 ml d’huile d’olive (1 c. à thé) à feu moyen-vif dans une grande poêle profonde ou casserole. Ajouter le poulet et le faire cuire 8 à 12 min en remuant, jusqu’à 74 °C au centre des morceaux épais.","Ajouter les 2 gousses d’ail hachées et 30 ml (2 c. à soupe) de pâte de cari rouge. Mélanger 30 à 60 secondes pour parfumer.","Verser TOUTE la boîte de tomates en dés de 398 ml AVEC son jus, puis TOUTE la boîte de lait de coco léger de 400 ml. Remuer jusqu’à ce que la sauce soit uniforme.","Ajouter directement les 500 g de légumes asiatiques SURGELÉS. Porter à léger bouillonnement, baisser à feu moyen-doux et laisser mijoter 12 à 15 minutes sans couvercle, en remuant de temps en temps.","Diviser le riz CUIT entre 4 contenants, puis répartir par-dessus TOUT le cari, poulet, légumes et sauce. Il ne reste rien à ajouter au dernier moment."],"storage":"Le riz et la sauce coco-tomate sont déjà assemblés. Réchauffer à 74 °C.","nutrition":{"calories":515,"protein_g":36,"carbs_g":52,"fat_g":17,"basis":"per_portion","estimated":true}},"shakeberry":{"id":"shakeberry","week":2,"title":"3 shakes vanille-petits fruits (mercredi)","servings":3,"minutes":5,"equipment":"Mélangeur; trois shakes préparés séparément","ingredients":[{"id":"whey","qty":90,"detail":"saveur vanille ou nature : 30 g par shake"},{"id":"oats","qty":120,"detail":"40 g SECS par shake"},{"id":"berries","qty":450,"detail":"surgelés : 150 g par shake"},{"id":"peanut","qty":45,"detail":"15 g par shake"},{"id":"water","qty":900,"detail":"300 ml par shake"}],"steps":["Les ingrédients listés correspondent à TROIS shakes. Pour UN seul : 30 g de whey + 40 g d’avoine sèche + 150 g de petits fruits },"cocoa":{"name":"Cacao pur non sucré","category":"Sauces et épices","unit":"g"},"chilipowder":{"name":"Poudre de chili (mélange d’épices, pas cayenne)","category":"Sauces et épices","unit":"c. à thé","url":"https://voila.ca/products/mccormick-gourmet-chili-powder-40-g/681670EA"},"cumin":{"name":"Cumin moulu","category":"Sauces et épices","unit":"c. à thé","url":"https://voila.ca/products/club-house-ground-cumin-90-g/503752EA"},"paprika":{"name":"Paprika fumé","category":"Sauces et épices","unit":"c. à thé","url":"https://voila.ca/products/mccormick-smoked-paprika-46-g/164655EA"},"oregano":{"name":"Origan séché","category":"Sauces et épices","unit":"c. à thé"},"ricevinegar":{"name":"Vinaigre de riz","category":"Sauces et épices","unit":"ml"},"salt":{"name":"Sel","category":"Sauces et épices","unit":"c. à thé"},"peppercorn":{"name":"Poivre noir moulu","category":"Sauces et épices","unit":"c. à thé"},"water":{"name":"Eau","category":"Autres","unit":"ml","skipShop":true}},"categories":["Viandes","Légumes et fruits","Féculents et conserves","Sauces et épices"],"assumptions":["Toutes les viandes sont pesées CRUES; riz, soba et avoine sont pesés SECS. Les quantités d’ingrédients correspondent à TOUTE la recette, pas à une portion.","Chaque plat salé contient déjà la sauce et tous ses accompagnements AVANT d’être rangé. Pour servir : réchauffer seulement.","Le mercredi peut rester une journée de trois shakes. Les déjeuners au restaurant la fin de semaine sont conservés comme habitudes, pas des repas imposés.","Réfrigérer ou congeler les plats périssables au plus tard 2 h après cuisson, dans de petits contenants peu profonds. Réfrigérateur ≤ 4 °C; manger les restes au frigo idéalement en 2 à 3 jours, sinon congeler.","Réchauffer les restes jusqu’à 74 °C. Cuisson initiale : volaille 74 °C, bœuf haché 71 °C, porc 71 °C, poisson 70 °C. Source : Santé Canada."],"safety_url":"https://www.canada.ca/fr/sante-canada/services/conseils-generaux-salubrite/temperatures-securitaires-cuisson-interne.html","storage_url":"https://www.canada.ca/fr/sante-canada/services/conseils-generaux-salubrite/conseils-salubrite-restes-alimentaires.html"}</script><script>
(function(){
"use strict";
var EN=JSON.parse(document.getElementById("v4-en").textContent);
var FR=JSON.parse(document.getElementById("v4-fr").textContent);
function $(id){return document.getElementById(id);}
function esc(v){return String(v===undefined?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function load(k,d){try{var x=localStorage.getItem(k);return x===null?d:JSON.parse(x);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var lang=load("v4-lang","fr");if(lang!=="fr"&&lang!=="en")lang="fr";
var week=load("v4-week",0);if(week!==0&&week!==1)week=0;
var shop=load("v4-shop",0);if([0,1,2].indexOf(shop)<0)shop=0;
var tab="rotation",recipe=EN.weeks[week][0],search="";
var P=function(){return lang==="fr"?FR:EN;};
function t(fr,en){return lang==="fr"?fr:en;}
function choices(w){var d={},old=load("v4-selected-w"+w,{});EN.weeks[w].forEach(function(id){d[id]=old[id]!==false;});return d;}
var selected=[choices(0),choices(1)];
function qformat(q){var x=Math.floor(q),r=Math.round((q-x)*100)/100,s={0.25:"¼",0.5:"½",0.75:"¾"}[r];return s?(x?String(x):"")+s:String(q).replace(".",lang==="fr"?",":".");}
function amount(q,unit){var v=qformat(q);if(unit==="un"||unit==="each")return v+" ×";if(unit==="boîte"||unit==="can")return v+" "+(lang==="fr"?(q>1?"boîtes":"boîte"):(q>1?"cans":"can"));if(unit==="gousse"||unit==="clove")return v+" "+(lang==="fr"?(q>1?"gousses":"gousse"):(q>1?"cloves":"clove"));return v+" "+unit;}
function nutrition(r){var n=r.nutrition;return "≈ "+n.calories+" kcal · P "+n.protein_g+" g · "+t("G ","C ")+n.carbs_g+" g · "+t("L ","F ")+n.fat_g+" g <small>"+t("(estimé/portion)","(est./serving)")+"</small>";}
function weekButtons(kind,active,max){var rows=[];for(var i=0;i<max;i++){rows.push('<button data-action="'+kind+'" data-value="'+i+'" aria-pressed="'+String(i===active)+'">'+(i===2?t("2 semaines","2 weeks"):t("Semaine ","Week ")+(i+1))+"</button>");}return '<div class="v4-switch">'+rows.join("")+"</div>";}
function show(kind){tab=kind;render();history.replaceState(null,"","#"+kind);window.scrollTo(0,0);}
function tally(s){var p=P(),ids=[],all={};for(var w=0;w<2;w++){if(s!==2&&w!==s)continue;p.weeks[w].forEach(function(id){if(selected[w][id])ids.push(id);});}ids.forEach(function(id){p.recipes[id].ingredients.forEach(function(it){if(p.products[it.id].skipShop)return;all[it.id]=(all[it.id]||0)+it.qty;});});return {ids:ids,all:all};}
function rotation(){var p=P(),count=p.weeks[week].filter(function(id){return selected[week][id];}),meal=count.filter(function(id){return !id.startsWith("shake");}).reduce(function(n,id){return n+p.recipes[id].servings;},0);
var cards=p.weeks[week].map(function(id){var r=p.recipes[id],on=selected[week][id];return '<article class="v4-panel v4-card '+(on?"":"off")+'"><div><span class="v4-pill">'+r.servings+" "+t("portions","servings")+'</span> <span class="v4-pill">'+r.minutes+' min</span></div><h3>'+esc(r.title)+'</h3><div class="v4-muted v4-small">'+esc(r.equipment)+"</div><div class='v4-muted v4-small'>"+nutrition(r)+'</div><div class="v4-bottom"><label><input type="checkbox" data-change="choose" data-id="'+esc(id)+'" '+(on?"checked":"")+'> '+t("Je veux cuisiner ceci","Plan to cook")+'</label><button class="v4-btn" data-action="open" data-value="'+esc(id)+'">'+t("Recette complète","Full recipe")+'</button></div></article>';}).join("");
return '<section class="v4-hero"><div class="v4-kicker">'+t("Cuisine quand tu veux","Cook on your schedule")+'</div><h1>'+t("Recettes complètes, restants prêts.<br>Sans dimanche obligatoire.","Complete recipes, ready leftovers.<br>No mandatory Sunday prep.")+'</h1><p class="v4-muted">'+esc(p.intro)+'</p><div class="v4-buttons"><button class="v4-btn primary" data-action="tab" data-value="recipes">'+t("Toutes les recettes","All recipes")+'</button><button class="v4-btn" data-action="tab" data-value="shopping">'+t("Mon épicerie","My groceries")+'</button></div></section><div class="v4-head"><h2>'+t("Rotation souple","Flexible rotation")+'</h2>'+weekButtons("week",week,2)+'</div><p class="v4-muted">'+t("Coche seulement les recettes que tu veux faire : l’épicerie inclut uniquement celles-là. L’ordre et les journées sont libres.","Check only the recipes you plan to cook; groceries include only those. Choose any order or day.")+'</p><div class="v4-grid">'+cards+'</div><div class="v4-alert"><strong>'+count.length+" "+t("recettes prévues — ","recipes chosen — ")+meal+" "+t("portions de repas salés","savoury meal portions")+'</strong><p>'+t("Chaque cuisson se fait au complet, avec sauce et accompagnements. Les 3 shakes sont facultatifs. Le déjeuner au restaurant la fin de semaine reste une habitude, sans jour imposé pour cuisiner.","Every batch includes its sauces and sides. Three shakes are optional. Weekend restaurant breakfasts remain a routine, not a required cooking day.")+'</p><button class="v4-btn primary" data-action="shoppingWeek" data-value="'+week+'">'+t("Voir l’épicerie de cette semaine","See this week’s groceries")+'</button></div>';
}
function recipeList(){var ids=EN.weeks[0].concat(EN.weeks[1]),p=P(),q=search.toLocaleLowerCase();
var hits=ids.filter(function(id){var r=p.recipes[id];return r.title.toLocaleLowerCase().includes(q)||r.ingredients.some(function(x){return p.products[x.id].name.toLocaleLowerCase().includes(q);});});
var nav='<div class="v4-dir"><input id="v4search" type="search" placeholder="'+t("Chercher ingrédient ou recette...","Search ingredient or recipe...")+'" value="'+esc(search)+'">'+hits.map(function(id){var r=p.recipes[id];return '<button data-action="recipe" data-value="'+esc(id)+'" aria-pressed="'+String(recipe===id)+'">'+esc(r.title)+'<br><small>'+t("Semaine ","Week ")+r.week+' · '+r.servings+' '+t("portions","servings")+'</small></button>';}).join("")+"</div>";
var r=p.recipes[recipe];var ingredients=r.ingredients.map(function(x){var prod=p.products[x.id];return '<li><strong>'+esc(amount(x.qty,prod.unit))+" "+esc(prod.name)+'</strong>'+(x.detail?'<small>'+esc(x.detail)+'</small>':'')+'</li>';}).join("");
var detail='<article class="v4-panel v4-detail"><div class="v4-kicker">'+t("Recette autonome — semaine ","Standalone recipe — week ")+r.week+'</div><h2>'+esc(r.title)+'</h2><span class="v4-pill">'+r.servings+" "+t("portions COMPLÈTES","COMPLETE servings")+'</span> <span class="v4-pill">⏱ '+r.minutes+' min</span><p class="v4-muted">'+esc(r.equipment)+'</p><div class="v4-callout"><strong>'+t("Quantités pour la recette COMPLÈTE, pas par portion.","Amounts for the ENTIRE recipe, not per serving.")+'</strong><br>'+t("Viandes pesées CRUES; riz, soba et avoine pesés SECS. Tout est cuisiné avant de ranger les restants.","Meat weighed RAW; rice, soba and oats weighed DRY. Everything is cooked before storing leftovers.")+'</div><h3>'+t("Tous les ingrédients","All ingredients")+'</h3><ul class="v4-ingredients">'+ingredients+'</ul><h3>'+t("Cuisson complète, étape par étape","Full cooking instructions, step by step")+'</h3><ol class="v4-steps">'+r.steps.map(function(s){return "<li>"+esc(s)+"</li>";}).join("")+'</ol><div class="v4-callout"><strong>'+t("Restants et service","Leftovers and serving")+'</strong><br>'+esc(r.storage)+'</div><p class="v4-muted v4-small">'+nutrition(r)+'<br>'+t("Macros approximatives seulement; vérifier les étiquettes des produits.","Macros are illustrative; check product labels.")+'</p><div class="v4-buttons"><button class="v4-btn" data-action="print">'+t("Imprimer","Print")+'</button><button class="v4-btn primary" data-action="shoppingWeek" data-value="'+(r.week-1)+'">'+t("Épicerie des recettes cochées","Selected recipes’ groceries")+'</button></div></article>';
return '<div class="v4-head"><h2>'+t("Toutes les recettes complètes","All complete recipes")+'</h2><span class="v4-muted">'+ids.length+" "+t("recettes","recipes")+'</span></div><div class="v4-layout">'+nav+detail+'</div>';
}
function shopping(){var p=P(),scope=tally(shop),count=Object.keys(scope.all).length,cats=p.categories;
var html=cats.map(function(cat){var rows=Object.keys(scope.all).filter(function(id){return p.products[id].category===cat;}).sort(function(a,b){return p.products[a].name.localeCompare(p.products[b].name,lang);});
if(!rows.length)return "";
return '<section class="v4-panel"><h3>'+esc(cat)+'</h3>'+rows.map(function(id){var item=p.products[id],qty=scope.all[id],done=!!load("v4-bought-"+shop,{})[id];
var pack=item.pack?Math.ceil(qty/item.pack-0.0000001):0,packstr=(item.pack&&item.unit!=="boîte"&&item.unit!=="can")?t("Format indicatif : ","Example pack: ")+pack+" × "+item.pack+" "+item.unit:"";
return '<div class="v4-shoprow"><input data-change="bought" data-id="'+esc(id)+'" type="checkbox" '+(done?"checked":"")+'><div class="v4-name"><strong class="'+(done?"v4-checkdone":"")+'">'+esc(amount(qty,item.unit))+" "+esc(item.name)+'</strong>'+(packstr?'<small>'+esc(packstr)+'</small>':'')+(item.hint?'<small>'+esc(item.hint)+'</small>':'')+'</div>'+(item.url?'<a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">Voilà</a>':'')+'</div>';}).join("")+'</section>';}).join("");
return '<div class="v4-head"><h2>'+t("Épicerie calculée depuis les recettes cochées","Groceries calculated from selected recipes")+'</h2>'+weekButtons("shop",shop,3)+'</div><p class="v4-muted">'+t("Quantités à UTILISER pour toutes les recettes choisies, sauces et épices incluses. Tu peux déjà avoir certains produits. Les formats et liens Voilà sont indicatifs, pas des stocks vérifiés.","Amounts to USE for selected recipes, sauces and spices included. You may already have some items. Voilà packs and links are examples, not verified inventory.")+'</p><p><span class="v4-pill">'+scope.ids.length+" "+t("recettes","recipes")+'</span> <span class="v4-pill">'+count+" "+t("ingrédients distincts","distinct ingredients")+'</span></p><div class="v4-shopgrid">'+(html||'<div class="v4-panel">'+t("Aucune recette cochée. Retourne à Rotation.","No recipes selected. Return to Rotation.")+'</div>')+'</div><div class="v4-buttons"><button class="v4-btn primary" data-action="copyshop">'+t("Copier la liste","Copy grocery list")+'</button><button class="v4-btn" data-action="resetshop">'+t("Réinitialiser les coches d’achat","Reset purchased checks")+'</button></div>';
}
function notes(){return '<div class="v4-head"><h2>'+t("Notes et conservation","Notes and food storage")+'</h2></div><div class="v4-grid"><div class="v4-panel"><h3>'+t("Mes notes","My notes")+'</h3><p class="v4-muted">'+t("Ces notes restent dans ton navigateur.","Notes remain in your browser.")+'</p><textarea class="v4-note" id="v4notes" placeholder="'+t("Mes ajustements de recettes...","Recipe adjustments...")+'">'+esc(load("v4-notes",""))+'</textarea><div class="v4-buttons"><button class="v4-btn" data-action="copynotes">'+t("Copier les notes","Copy notes")+'</button><button class="v4-btn" data-action="export">'+t("Exporter JSON","Export JSON")+'</button></div></div><div class="v4-panel"><h3>'+t("Conventions du plan","Plan conventions")+'</h3><ul>'+P().assumptions.map(function(s){return "<li>"+esc(s)+"</li>";}).join("")+'</ul><a href="'+esc(P().safety_url)+'" target="_blank" rel="noopener noreferrer">'+t("Températures — Santé Canada","Temperatures — Health Canada")+'</a> · <a href="'+esc(P().storage_url)+'" target="_blank" rel="noopener noreferrer">'+t("Restants — Santé Canada","Leftovers — Health Canada")+'</a></div></div>';}
function render(){document.documentElement.lang=lang;document.title=P().title;$("v4brand").textContent=t("✳ Mes recettes","✳ My recipes");$("v4footer").textContent=t("Version 4.0 · Recettes complètes · 2 semaines flexibles · Sauces déjà intégrées.","Version 4.0 · Complete recipes · Flexible 2-week rotation · Sauces included.");
document.querySelectorAll("[data-tab]").forEach(function(x){var names={rotation:t("Rotation","Rotation"),recipes:t("Recettes","Recipes"),shopping:t("Épicerie","Groceries"),notes:t("Notes","Notes")};x.textContent=names[x.dataset.tab];x.setAttribute("aria-pressed",String(tab===x.dataset.tab));});
document.querySelectorAll("[data-lang]").forEach(function(x){x.setAttribute("aria-pressed",String(lang===x.dataset.lang));});
$("v4main").innerHTML=tab==="rotation"?rotation():tab==="recipes"?recipeList():tab==="shopping"?shopping():notes();
}
async function copy(s){try{await navigator.clipboard.writeText(s);}catch(e){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}}
function copyGroceries(){var p=P(),x=tally(shop),out=[t("Épicerie ","Groceries ")+(shop===2?t("2 semaines","2 weeks"):t("semaine ","week ")+(shop+1))];p.categories.forEach(function(cat){var ids=Object.keys(x.all).filter(function(id){return p.products[id].category===cat;});if(ids.length){out.push("\n"+cat);ids.forEach(function(id){out.push("- "+amount(x.all[id],p.products[id].unit)+" "+p.products[id].name);});}});return out.join("\n");}
function exportData(){var x=new Blob([JSON.stringify({plan:P(),selected:selected,notes:load("v4-notes","")},null,2)],{type:"application/json"}),u=URL.createObjectURL(x),a=document.createElement("a");a.href=u;a.download="recettes-v4.json";a.click();setTimeout(function(){URL.revokeObjectURL(u);},1000);}
document.addEventListener("click",function(e){var b=e.target.closest("[data-tab],[data-lang],[data-action]");if(!b)return;
if(b.dataset.tab){show(b.dataset.tab);return;}if(b.dataset.lang){lang=b.dataset.lang;save("v4-lang",lang);render();return;}
var act=b.dataset.action,val=b.dataset.value;
if(act==="tab"){show(val);return;}if(act==="week"){week=Number(val);save("v4-week",week);render();return;}
if(act==="shop"){shop=Number(val);save("v4-shop",shop);render();return;}
if(act==="shoppingWeek"){shop=Number(val);save("v4-shop",shop);show("shopping");return;}
if(act==="open"||act==="recipe"){recipe=val;search="";show("recipes");return;}
if(act==="print"){window.print();return;}
if(act==="copyshop"){copy(copyGroceries());return;}
if(act==="resetshop"){save("v4-bought-"+shop,{});render();return;}
if(act==="copynotes"){copy(load("v4-notes",""));return;}
if(act==="export"){exportData();return;}
});
document.addEventListener("change",function(e){var x=e.target;
if(x.dataset.change==="choose"){selected[week][x.dataset.id]=x.checked;save("v4-selected-w"+week,selected[week]);render();}
if(x.dataset.change==="bought"){var k="v4-bought-"+shop,v=load(k,{});v[x.dataset.id]=x.checked;save(k,v);render();}
});
document.addEventListener("input",function(e){if(e.target.id==="v4notes")save("v4-notes",e.target.value);if(e.target.id==="v4search"){search=e.target.value;}});
document.addEventListener("keydown",function(e){if(e.target.id==="v4search"&&e.key==="Enter"){e.preventDefault();render();}});
var hash=location.hash.slice(1);if(["rotation","recipes","shopping","notes"].includes(hash))tab=hash;
render();
})();
</script></body></html>
